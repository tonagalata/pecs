<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PictoTalk</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f2f5f4;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Shown until the app's JavaScript has downloaded; React replaces it with the same screen
         (src/components/Loading.tsx) while the board and voices load. -->
    <style>
      .boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
        background: #f2f5f4; color: #17302e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-title { font-size: 26px; font-weight: 600; margin: 0; }
      .boot-status { font-size: 17px; color: #485a57; margin: 0; }
      .boot-spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #d8e0dd; border-top-color: #1e5c73; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spin { animation-duration: 2.4s; } }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to use PictoTalk.</noscript>
    <div id="root">
      <div class="boot" role="progressbar" aria-label="Loading PictoTalk">
        <svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="12" fill="#1e5c73" />
          <g transform="translate(8 8)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M14 17.5h7" />
          </g>
        </svg>
        <p class="boot-title">PictoTalk</p>
        <div class="boot-spin"></div>
        <p class="boot-status" id="boot-status">Loading…</p>
      </div>
    </div>
    <script>
      // Reload by itself if the app fails to start: a script that didn't load, or code that loaded
      // but never replaced this screen within 5 s. A slow download is left alone (DOMContentLoaded
      // only fires once the app's scripts have arrived). Shares its limit with src/components/Loading.tsx.
      (function () {
        var KEY = 'pictotalk:reloads', MAX = 3;
        function reload() {
          if (!document.querySelector('.boot')) return;
          var n = 0;
          try { n = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) { n = MAX; }
          var status = document.getElementById('boot-status');
          if (n >= MAX) { if (status) status.textContent = 'Still loading. Check the internet connection.'; return; }
          try { sessionStorage.setItem(KEY, String(n + 1)); } catch (e) {}
          if (status) status.textContent = 'Refreshing…';
          location.reload();
        }
        window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') reload(); }, true);
        document.addEventListener('DOMContentLoaded', function () { setTimeout(reload, 5000); });
      })();
    </script>
  </body>
</html>
